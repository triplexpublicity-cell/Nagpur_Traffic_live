<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nagpur Traffic Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden;background:#e5e7eb}.top{position:fixed;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}.searchWrap{position:relative;flex:1}.search,.dest{width:100%;border:0;border-radius:16px;padding:14px 16px;background:#fff;box-shadow:0 4px 18px #0002;font-size:16px;outline:0}.btn{border:0;border-radius:16px;padding:14px 16px;background:#111;color:#fff;font-weight:800;box-shadow:0 4px 18px #0002}.loc{background:#fff;color:#111;font-size:20px;padding:11px 14px}.suggestions{position:absolute;top:55px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 6px 24px #0003;overflow:hidden;max-height:300px;overflow-y:auto}.suggestion{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}.suggestion b{display:block;font-size:14px}.suggestion span{display:block;color:#667085;font-size:12px;margin-top:3px}.routebar{position:fixed;z-index:1000;top:68px;left:10px;right:10px;display:flex;gap:8px}.routebar .dest{flex:1}.routebar .btn{background:#fff;color:#111}.panel{position:fixed;z-index:1000;left:12px;right:12px;bottom:12px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 28px #0003}.title{font-size:12px;color:#667085}.nav{font-size:27px;font-weight:900;margin:4px 0}.status{font-weight:800}.green{color:#15803d}.amber{color:#b45309}.muted{color:#667085}.row{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.pill{padding:8px 11px;border-radius:12px;background:#f2f4f7;font-size:13px}.notice{position:fixed;z-index:2000;top:132px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:12px;display:none;font-size:12px}.leaflet-control-locate{background:#fff;border:2px solid #fff;border-radius:8px;box-shadow:0 1px 5px #0006}.locateBtn{display:block;width:36px;height:36px;border:0;background:#fff;font-size:20px;border-radius:8px;cursor:pointer}@media(max-width:600px){.top{top:8px}.search{font-size:15px}.panel{left:9px;right:9px;bottom:9px}.routebar{top:64px}.routebar .dest{font-size:14px}}
</style>
</head><body>
<div id="map"></div><div id="notice" class="notice"></div>
<div class="top"><div class="searchWrap"><input id="search" class="search" autocomplete="off" placeholder="Search place, road or address…"><div id="suggestions" class="suggestions" style="display:none"></div></div><button id="searchBtn" class="btn">Search</button><button id="locBtn" class="btn loc" title="My location">📍</button></div>
<div class="routebar"><input id="destination" class="dest" autocomplete="off" placeholder="Destination — e.g. Nagpur Railway Station"><button id="routeBtn" class="btn">Route</button></div>
<div class="panel"><div class="title">NAVIGATION</div><div class="nav" id="navTitle">Ready</div><div id="status" class="status green">● GPS / Map ready</div><div class="row"><span class="pill" id="traffic">Traffic ETA: —</span><span class="pill" id="gps">GPS: waiting…</span></div><div class="row"><span class="muted" id="routeInfo">Route: —</span><span class="muted" id="speed">Speed: —</span></div><div style="margin-top:10px" class="muted" id="signalNote">🚦 Signal countdown: no authorised public live signal feed connected.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const NAGPUR=[21.1458,79.0882];let map,userMarker=null,accuracyCircle=null,userPos=null,watchId=null,routeLine=null,destMarker=null,suggestTimer=null;
const signalPoints=[['LAD Square',21.1265,79.0519],['Bajaj Nagar Square',21.1278,79.0646],['Kachipura Square',21.1329,79.0660],['Deekshabhoomi Square',21.1244,79.0517],['Laxmi Nagar Square',21.1270,79.0610],['Shankar Nagar Square',21.1358,79.0554],['VNIT Square',21.1237,79.0510]];
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>n.style.display='none',2400)}
function init(){map=L.map('map',{zoomControl:true}).setView(NAGPUR,12.8);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);addSignalMarkers();addLocateControl();startGPS();}
function addSignalMarkers(){signalPoints.forEach(s=>{const m=L.marker([s[1],s[2]]).addTo(map);m.bindPopup('<b>🚦 '+s[0]+'</b><br><span style="color:#b45309">Live countdown unavailable</span><br><small>No authorised public signal-controller feed is currently connected.</small>')})}
function addLocateControl(){const c=L.control({position:'topright'});c.onAdd=function(){const d=L.DomUtil.create('div','leaflet-control leaflet-bar leaflet-control-locate');const b=L.DomUtil.create('button','locateBtn',d);b.innerHTML='⌖';b.title='My location';L.DomEvent.disableClickPropagation(d);b.onclick=currentLocation;return d};c.addTo(map)}
function startGPS(){if(!navigator.geolocation){setGps('GPS: not supported');return}watchId=navigator.geolocation.watchPosition(p=>{const c=p.coords;userPos=[c.latitude,c.longitude];setGps('GPS: live');document.getElementById('speed').textContent='Speed: '+(c.speed==null?'—':Math.max(0,c.speed*3.6).toFixed(0)+' km/h');if(!userMarker){userMarker=L.marker(userPos,{title:'Current location'}).addTo(map).bindPopup('📍 You are here');accuracyCircle=L.circle(userPos,{radius:c.accuracy||20,weight:1,fillOpacity:.12}).addTo(map)}else{userMarker.setLatLng(userPos);accuracyCircle.setLatLng(userPos);accuracyCircle.setRadius(c.accuracy||20)}},()=>{setGps('GPS: permission needed');notice('Allow location permission for live tracking')},{enableHighAccuracy:true,maximumAge:2000,timeout:12000})}
function setGps(t){document.getElementById('gps').textContent=t}
function currentLocation(){if(!userPos)return notice('Waiting for GPS permission…');map.setView(userPos,17);if(userMarker)userMarker.openPopup()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function getSuggestions(q){const box=document.getElementById('suggestions');if(q.length<2){box.style.display='none';return}clearTimeout(suggestTimer);suggestTimer=setTimeout(async()=>{try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=in&q='+encodeURIComponent(q+', Nagpur');const r=await fetch(url,{headers:{'Accept-Language':'en'}});const a=await r.json();box.innerHTML=a.map(x=>'<div class="suggestion" data-lat="'+x.lat+'" data-lon="'+x.lon+'" data-name="'+esc(x.display_name)+'"><b>'+esc((x.display_name||'').split(',')[0])+'</b><span>'+esc(x.display_name)+'</span></div>').join('');box.style.display=a.length?'block':'none';box.querySelectorAll('.suggestion').forEach(el=>el.onclick=()=>selectSuggestion(el));}catch(e){box.style.display='none'}},250)}
function selectSuggestion(el){const lat=+el.dataset.lat,lon=+el.dataset.lon,name=el.dataset.name;document.getElementById('search').value=name.split(',').slice(0,2).join(',');document.getElementById('suggestions').style.display='none';map.setView([lat,lon],16);if(destMarker)destMarker.remove();destMarker=L.marker([lat,lon]).addTo(map).bindPopup('<b>'+esc(name)+'</b>').openPopup()}
async function searchPlace(){const q=document.getElementById('search').value.trim();if(!q)return;const box=document.getElementById('suggestions');box.style.display='none';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q='+encodeURIComponent(q+', Nagpur'),{headers:{'Accept-Language':'en'}});const a=await r.json();if(!a[0])throw Error();map.setView([+a[0].lat,+a[0].lon],16);notice('Location found')}catch(e){notice('Location not found')}}
async function routeToDestination(){const q=document.getElementById('destination').value.trim();if(!q)return notice('Enter a destination');if(!userPos)return notice('Allow GPS first');notice('Finding route…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q='+encodeURIComponent(q+', Nagpur'),{headers:{'Accept-Language':'en'}});const a=await r.json();if(!a[0])throw Error();const d=[+a[0].lat,+a[0].lon];const rr=await fetch('https://router.project-osrm.org/route/v1/driving/'+userPos[1]+','+userPos[0]+';'+d[1]+','+d[0]+'?overview=full&geometries=geojson&steps=false');const data=await rr.json();if(data.code!=='Ok'||!data.routes[0])throw Error();if(routeLine)routeLine.remove();routeLine=L.geoJSON(data.routes[0].geometry,{style:{weight:6,opacity:.85}}).addTo(map);if(destMarker)destMarker.remove();destMarker=L.marker(d).addTo(map).bindPopup('🏁 '+esc(q)).openPopup();map.fitBounds(routeLine.getBounds(),{padding:[30,150]});const km=data.routes[0].distance/1000,min=Math.round(data.routes[0].duration/60);document.getElementById('navTitle').textContent=q;document.getElementById('traffic').textContent='ETA: '+min+' min';document.getElementById('routeInfo').textContent='Route: '+km.toFixed(1)+' km';document.getElementById('status').textContent='● Live GPS navigation';notice('Route ready')}catch(e){notice('Route unavailable right now')}}
document.getElementById('search').addEventListener('input',e=>getSuggestions(e.target.value.trim()));document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});document.getElementById('searchBtn').onclick=searchPlace;document.getElementById('locBtn').onclick=currentLocation;document.getElementById('routeBtn').onclick=routeToDestination;document.getElementById('destination').addEventListener('keydown',e=>{if(e.key==='Enter')routeToDestination()});document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))document.getElementById('suggestions').style.display='none'});init();
</script></body></html>
