<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Nagpur Traffic Live</title><link href='https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css' rel='stylesheet'><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif}body{overflow:hidden}.top{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center}.brand{background:#fff;padding:11px 14px;border-radius:14px;box-shadow:0 4px 18px #0002;font-weight:800}.search{flex:1;max-width:430px;border:0;padding:12px 16px;border-radius:14px;box-shadow:0 4px 18px #0002;font-size:15px}.panel{position:fixed;z-index:5;right:14px;bottom:14px;width:320px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 28px #0003}.sig{display:flex;justify-content:space-between;align-items:center}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:7px}.green{background:#16a34a}.red{background:#dc2626}.yellow{background:#eab308}.count{font-size:40px;font-weight:900}.small{color:#667085;font-size:13px}.row{display:flex;justify-content:space-between;margin-top:12px}.pill{padding:6px 9px;border-radius:10px;background:#f2f4f7;font-size:12px}.legend{position:fixed;z-index:5;left:14px;bottom:14px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 18px #0002;font-size:12px}.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}</style></head><body><div id='map'></div><div class='top'><div class='brand'>🚦 Nagpur Traffic Live</div><input class='search' placeholder='Search road or chowk…' /></div><div class='legend'><b>Signals</b> &nbsp; <span class='dot green'></span>Green &nbsp;<span class='dot yellow'></span>Yellow &nbsp;<span class='dot red'></span>Red</div><div class='panel'><div class='small'>SELECTED JUNCTION</div><div class='sig'><div><h2 style='margin:5px 0'>LAD Square</h2><div><span id='light' class='dot green'></span><b id='state'>GREEN</b></div></div><div class='count' id='count'>27</div></div><div class='small'>seconds remaining</div><div class='row'><span class='pill'>Traffic: Moderate</span><span class='pill'>Next: 650 m</span></div><div class='row'><span class='small'>Cycle: 90 sec</span><span class='small'>Demo feed</span></div></div><script type='module'>import maplibregl from 'https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs';import 'https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css';const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[79.0882,21.1458],zoom:12.7});map.addControl(new maplibregl.NavigationControl(),'bottom-right');const signals=[['LAD Square',79.0737,21.1462,27],['Variety Square',79.0833,21.1447,41],['Maharajbagh',79.0586,21.1431,18],['Ajni Square',79.0865,21.1226,52],['Sadar',79.0795,21.1537,33],['Manish Nagar',79.0870,21.1115,12]];signals.forEach(([name,lng,lat,t])=>{const el=document.createElement('div');el.style.cssText='width:20px;height:20px;border-radius:50%;background:#16a34a;border:3px solid white;box-shadow:0 2px 8px #0005;cursor:pointer';el.title=name;new maplibregl.Marker(el).setLngLat([lng,lat]).setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>🚦 '+name+'</b><br>Live signal demo')).addTo(map)});let remaining=27,phase=0;setInterval(()=>{remaining--;if(remaining<=0){phase=(phase+1)%3;remaining=[27,7,41][phase];const states=[['GREEN','green'],['YELLOW','yellow'],['RED','red']];document.getElementById('state').textContent=states[phase][0];document.getElementById('light').className='dot '+states[phase][1]}document.getElementById('count').textContent=remaining},1000);if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{const m=document.getElementById('me');if(!m){const e=document.createElement('div');e.id='me';e.style.cssText='width:16px;height:16px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0005';window.me=new maplibregl.Marker(e).setLngLat([p.coords.longitude,p.coords.latitude]).addTo(map)}else window.me.setLngLat([p.coords.longitude,p.coords.latitude])},{enableHighAccuracy:true})}</script></body></html>
