<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nagpur Traffic Live</title>
<link href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif}body{overflow:hidden;background:#e5e7eb}
.top{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;pointer-events:none}.brand,.search{pointer-events:auto;background:#fff;box-shadow:0 4px 18px #0002}.brand{padding:11px 14px;border-radius:14px;font-weight:800}.search{flex:1;max-width:430px;border:0;padding:13px 16px;border-radius:14px;font-size:15px;outline:none}
.panel{position:fixed;z-index:5;right:14px;bottom:14px;width:320px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 28px #0003}.sig{display:flex;justify-content:space-between;align-items:center}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}.green{background:#16a34a}.red{background:#dc2626}.yellow{background:#eab308}.count{font-size:40px;font-weight:900}.small{color:#667085;font-size:13px}.row{display:flex;justify-content:space-between;margin-top:12px}.pill{padding:6px 9px;border-radius:10px;background:#f2f4f7;font-size:12px}.legend{position:fixed;z-index:5;left:14px;bottom:14px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 18px #0002;font-size:12px}.map-error{position:fixed;z-index:4;top:90px;left:50%;transform:translateX(-50%);background:#fff;padding:9px 13px;border-radius:12px;box-shadow:0 4px 18px #0002;font-size:12px;display:none}.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}
@media(max-width:600px){.top{top:10px;left:10px;right:10px}.brand{font-size:15px;max-width:185px}.search{min-width:0;font-size:14px}.panel{left:10px;right:10px;bottom:10px;width:auto}.legend{left:10px;bottom:10px;transform:translateY(-154px)}}
</style>
</head>
<body>
<div id="map"></div>
<div id="mapError" class="map-error">Map loading…</div>
<div class="top"><div class="brand">🚦 Nagpur Traffic Live</div><input id="search" class="search" placeholder="Search road or chowk…" /></div>
<div class="legend"><b>Signals</b> &nbsp; <span class="dot green"></span>Green &nbsp;<span class="dot yellow"></span>Yellow &nbsp;<span class="dot red"></span>Red</div>
<div class="panel"><div class="small">SELECTED JUNCTION</div><div class="sig"><div><h2 id="junction" style="margin:5px 0">LAD Square</h2><div><span id="light" class="dot green"></span><b id="state">GREEN</b></div></div><div class="count" id="count">27</div></div><div class="small">seconds remaining</div><div class="row"><span class="pill">Traffic: Moderate</span><span class="pill">Next: 650 m</span></div><div class="row"><span class="small">Cycle: 90 sec</span><span class="small">Demo feed</span></div></div>
<script type="module">
import maplibregl from 'https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs';

const mapStyle={
 version:8,
 sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},
 layers:[{id:'osm',type:'raster',source:'osm'}]
};

const map=new maplibregl.Map({container:'map',style:mapStyle,center:[79.0882,21.1458],zoom:12.7,attributionControl:true});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');

const signals=[
 ['LAD Square',79.0737,21.1462,27],['Variety Square',79.0833,21.1447,41],
 ['Maharajbagh',79.0586,21.1431,18],['Ajni Square',79.0865,21.1226,52],
 ['Sadar',79.0795,21.1537,33],['Manish Nagar',79.0870,21.1115,12]
];

function addSignals(){
 signals.forEach(([name,lng,lat,t])=>{
   const el=document.createElement('div');
   el.style.cssText='width:22px;height:22px;border-radius:50%;background:#16a34a;border:3px solid white;box-shadow:0 2px 8px #0005;cursor:pointer';
   el.title=name;
   new maplibregl.Marker(el).setLngLat([lng,lat]).setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>🚦 '+name+'</b><br>Signal countdown: DEMO')).addTo(map);
 });
}
map.on('load',()=>{addSignals();document.getElementById('mapError').style.display='none'});
map.on('error',e=>{console.warn('Map error',e);document.getElementById('mapError').textContent='Map tiles are loading…';document.getElementById('mapError').style.display='block'});

let selected=0, remaining=27, phase=0;
const states=[['GREEN','green'],['YELLOW','yellow'],['RED','red']];
setInterval(()=>{
 remaining--;
 if(remaining<=0){phase=(phase+1)%3;remaining=[27,7,41][phase];document.getElementById('state').textContent=states[phase][0];document.getElementById('light').className='dot '+states[phase][1]}
 document.getElementById('count').textContent=remaining;
},1000);

const search=document.getElementById('search');
search.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 const q=search.value.trim().toLowerCase();
 const i=signals.findIndex(s=>s[0].toLowerCase().includes(q));
 if(i>=0){selected=i;const [name,lng,lat]=signals[i];document.getElementById('junction').textContent=name;map.flyTo({center:[lng,lat],zoom:15,duration:800});}
});

if(navigator.geolocation){
 navigator.geolocation.watchPosition(p=>{
   const lng=p.coords.longitude,lat=p.coords.latitude;
   if(!window.me){const e=document.createElement('div');e.style.cssText='width:16px;height:16px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0005';window.me=new maplibregl.Marker(e).setLngLat([lng,lat]).addTo(map)}
   else window.me.setLngLat([lng,lat]);
 },()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}
</script>
</body></html>
